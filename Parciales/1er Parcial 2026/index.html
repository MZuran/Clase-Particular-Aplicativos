<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Envíos — DAI 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body>

<div class="container py-4">

  <div class="text-center mb-4">
    <h1 class="h3 fw-bold">Calculadora de Envíos 📦</h1>
    <p class="text-muted">Calculadora de Envíos — DAI 2026</p>
  </div>

  <!-- Formulario de cotización -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white fw-bold">Cotizar</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">

        <div class="col-md-4">
          <label for="select-tipo" class="form-label fw-semibold">Tipo de envío</label>

          <select id="select-tipo" class="form-select">
            <option value="peso">Por peso (kg → $)</option>
            <option value="distancia">Por distancia (km → $)</option>
            <option value="internacional">Internacional ($ → USD)</option>
          </select>
          
        </div>

        <div class="col-md-4">
          <label for="input-valor" class="form-label fw-semibold">Valor</label>
          <input type="number" id="input-valor" class="form-control" placeholder="Ingresá un valor">
        </div>

        <div class="col-md-4">
          <button class="btn btn-primary w-100" onclick="cotizarEnvio()">Cotizar</button>
        </div>

      </div>

      <!-- Ejercicio 3.1: resultado acá -->
      <div id="resultado" class="mt-3"></div>
    </div>
  </div>

  <!-- Historial -->
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center">
      <span>Historial</span>
      <button class="btn btn-sm btn-outline-light" onclick="limpiarEnvios()">Limpiar</button>
    </div>
    <div class="card-body">
      <!-- Ejercicio 3.2: mostrarEnvios() escribe acá -->
      <div id="lista-historial"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
